log_format ledgerline escape=json '{"service":"web","severity":"INFO","message":"HTTP request","route":"$uri","status":$status,"duration_seconds":$request_time}';
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 4;
  gzip_types text/css application/javascript application/json image/svg+xml;
  access_log /dev/stdout ledgerline;
  location / { try_files $uri $uri/ /index.html; }
  # Vite filenames are content-hashed. Cache only these public static assets.
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /runtime.json { add_header Cache-Control "no-store"; }
  location /platform/ { proxy_pass http://gateway:8080; proxy_set_header X-Request-ID $request_id; }
  location /api/ { proxy_pass http://gateway:8080; proxy_read_timeout 70s; proxy_set_header X-Request-ID $request_id; }
  location = /health { access_log off; return 200 'ok'; }
}
