route:
  receiver: local-inbox
  group_by: [alertname, service]
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 4h
receivers:
  - name: local-inbox
    email_configs:
      - to: operator@ledgerline.local
        from: alerts@ledgerline.local
        smarthost: mailpit:1025
        require_tls: false
        send_resolved: true
