input {
  gelf { port => 12201 use_tcp => false use_udp => true }
  http { port => 8080 codec => json_lines }
}
filter {
  if [log] { mutate { rename => { "log" => "message" } } }
  json { source => "message" target => "app" skip_on_invalid_json => true }
  if [app][@timestamp] { date { match => ["[app][@timestamp]", "ISO8601"] } }
  else if [app][time] { date { match => ["[app][time]", "UNIX_MS"] } }
  else if [date] { date { match => ["date", "UNIX"] } }
  if [app][service] { mutate { add_field => { "service_name" => "%{[app][service]}" } } }
  else if [container_name] { mutate { add_field => { "service_name" => "%{[container_name]}" } } }
  else if [kubernetes][container_name] { mutate { add_field => { "service_name" => "%{[kubernetes][container_name]}" } } }
  else { mutate { add_field => { "service_name" => "unknown" } } }
  if [app][trace_id] { mutate { add_field => { "trace_id" => "%{[app][trace_id]}" } } }
  else if [app][traceId] { mutate { add_field => { "trace_id" => "%{[app][traceId]}" } } }
  if [app][level] { mutate { add_field => { "severity" => "%{[app][level]}" } } }
  else if [app][LogLevel] { mutate { add_field => { "severity" => "%{[app][LogLevel]}" } } }
  else { mutate { add_field => { "severity" => "INFO" } } }
  if [app][State][trace_id] { mutate { replace => { "trace_id" => "%{[app][State][trace_id]}" } } }
  if [app][State][service] { mutate { replace => { "service_name" => "%{[app][State][service]}" } } }
  mutate { gsub => ["service_name", "^/?ledgerline-", "", "service_name", "-[0-9]+$", ""] }
  if [app][status] { mutate { add_field => { "status" => "%{[app][status]}" } } }
  else if [app][State][status] { mutate { add_field => { "status" => "%{[app][State][status]}" } } }
  if [status] { mutate { convert => { "status" => "integer" } } }
  mutate { convert => { "severity" => "string" } }
  translate { source => "severity" target => "severity" dictionary => { "30" => "INFO" "40" => "WARN" "50" => "ERROR" "60" => "FATAL" "20" => "DEBUG" "10" => "TRACE" "Information" => "INFO" "Warning" => "WARN" "Error" => "ERROR" } }
  # Kubernetes label keys contain dots and can conflict with Elasticsearch object paths.
  # Retain namespace/pod/container identity; omit unbounded labels and annotations locally.
  mutate { remove_field => ["host", "[kubernetes][labels]", "[kubernetes][annotations]", "[app][password]", "[app][authorization]", "[app][access_token]", "[app][refresh_token]"] }
}
output {
  elasticsearch { hosts => ["http://elasticsearch:9200"] index => "ledgerline-logs-%{+YYYY.MM.dd}" ilm_enabled => false }
}
