# Accept instrumented traffic without exporter retries or trace storage in daily mode.
receivers:
  otlp:
    protocols:
      grpc: {endpoint: '0.0.0.0:4317'}
      http: {endpoint: '0.0.0.0:4318'}
processors:
  memory_limiter: {check_interval: 5s, limit_mib: 40, spike_limit_mib: 10}
  probabilistic_sampler: {sampling_percentage: 0}
exporters:
  debug: {verbosity: basic}
service:
  pipelines:
    traces: {receivers: [otlp], processors: [memory_limiter, probabilistic_sampler], exporters: [debug]}
