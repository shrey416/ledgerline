apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Elasticsearch
    uid: elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    editable: false
    jsonData: {index: 'ledgerline-logs-*', timeField: '@timestamp', logMessageField: message, logLevelField: severity}
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: elasticsearch
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        filterByTraceID: true
        customQuery: true
        query: 'trace_id:"$${__span.traceId}"'

